<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEGEN">
<link rel="manifest" href='data:application/manifest+json,{"name":"DEGEN","short_name":"DEGEN","display":"fullscreen","orientation":"portrait","background_color":"%2307060a","theme_color":"%2307060a","start_url":"/"}'>
<title>DEGEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07060a;
  --felt:#0d0a12;
  --gold-1:#fff3c4;
  --gold-2:#f5d061;
  --gold-3:#c9931a;
  --gold-4:#7a5410;
  --loss:#ff4d5e;
  --win:#59ffa3;
  --text:#e9e2cf;
  --dim:#8d8571;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--ink);
  color:var(--text);
  overflow:hidden;
  user-select:none;
  overscroll-behavior:none;
}
/* ambient table */
.table{
  position:fixed;inset:0;
  background:
    radial-gradient(120% 90% at 50% 118%, rgba(201,147,26,.22), transparent 55%),
    radial-gradient(90% 70% at 50% -20%, rgba(245,208,97,.10), transparent 60%),
    radial-gradient(140% 140% at 50% 50%, var(--felt) 0%, var(--ink) 78%);
}
.table::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,243,196,.04) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(80% 70% at 50% 45%, #000 30%, transparent 100%);
}
.stage{
  position:relative;height:100%;max-width:460px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;
  padding:max(14px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom));
}
/* real phone viewport: track the dynamic toolbar so controls never sit under it */
@supports (height:100dvh){ html,body{height:100dvh} .stage{height:100dvh} }
/* short screens: shrink the chrome so everything fits without scrolling */
@media (max-height:720px){
  .wordmark{font-size:34px}
  .coin{--d:min(52vw,200px)}
  .controls{gap:9px}
  .side-btn{font-size:21px;padding:11px 0 9px;border-radius:13px}
  .wg{min-width:44px;padding:7px 0;font-size:13px}
  .bank{padding:6px 12px}
  .bank .amt{font-size:18px}
  .mute{width:36px;height:36px;font-size:15px}
}

/* ── header ── */
header{width:100%;display:flex;align-items:flex-end;justify-content:space-between}
.wordmark{
  font-family:'Bebas Neue',sans-serif;
  font-size:44px;line-height:.9;letter-spacing:.14em;
  background:linear-gradient(178deg, var(--gold-1) 8%, var(--gold-2) 38%, var(--gold-3) 62%, var(--gold-4) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(201,147,26,.35));
  animation:markGlow 3.4s ease-in-out infinite;
}
@keyframes markGlow{50%{filter:drop-shadow(0 2px 22px rgba(245,208,97,.7))}}
.bank{
  text-align:right;cursor:pointer;border:1px solid rgba(245,208,97,.22);
  border-radius:14px;padding:8px 14px;background:rgba(245,208,97,.05);
  transition:border-color .2s, transform .15s;
}
.bank:active{transform:scale(.96)}
.bank .lbl{font-size:9px;letter-spacing:.3em;color:var(--dim)}
.bank .amt{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px;
  color:var(--gold-2);text-shadow:0 0 18px rgba(245,208,97,.35);
  font-variant-numeric:tabular-nums;
}
.bank.pulse{animation:bankPulse .5s ease}
@keyframes bankPulse{40%{border-color:var(--gold-2);box-shadow:0 0 0 6px rgba(245,208,97,.12)}}

/* ── coin arena ── */
.arena{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.hop{will-change:transform}
.coin-wrap{perspective:1100px;cursor:pointer;position:relative}
.coin{
  --d:min(62vw,250px);
  width:var(--d);height:var(--d);position:relative;
  transform-style:preserve-3d;
  transition:transform 0s;
  will-change:transform;
}
.idle .hop{animation:float 4.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.face{
  position:absolute;inset:0;border-radius:50%;
  backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;
  background:
    radial-gradient(circle at 35% 30%, #ffe9a0 0%, #f0c94e 42%, #d4a428 68%, #b8860b 100%);
  box-shadow:
    inset 0 0 0 5px #c9931a,
    inset 0 0 0 8px #f7dd7e,
    inset 0 -14px 24px rgba(90,60,8,.4),
    inset 0 12px 22px rgba(255,248,214,.45),
    0 24px 60px rgba(0,0,0,.65),
    0 0 90px rgba(212,160,32,.25);
}
.face::before{ /* inner beaded ring, like a real coin */
  content:"";position:absolute;inset:9%;border-radius:50%;
  border:2px solid rgba(122,84,16,.5);
  box-shadow:inset 0 0 0 2px rgba(255,243,196,.4);
}
.face .glyph{
  font-size:calc(var(--d)*.5);line-height:1;
  color:#8a6210;
  text-shadow:0 2px 0 #ffefad, 0 -2px 2px rgba(60,38,4,.6);
  transform:translateY(2%);
}
.face.tails{transform:rotateX(180deg)}
/* shimmer sweep on idle */
.sheen{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;
}
.sheen::after{
  content:"";position:absolute;top:-30%;bottom:-30%;width:34%;left:-60%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
  transform:skewX(-18deg);
  animation:sweep 3.6s ease-in-out infinite;
}
@keyframes sweep{0%,55%{left:-60%}85%,100%{left:130%}}
.flipping .sheen::after{animation:none}

/* ── light show ── */
.beams{position:absolute;inset:-40%;pointer-events:none;filter:blur(2px);opacity:.55}
.beams i{position:absolute;inset:0;
  background:conic-gradient(from 0deg,
    transparent 0 8%, rgba(245,208,97,.16) 10% 13%, transparent 15% 33%,
    rgba(255,243,196,.12) 35% 38%, transparent 40% 58%,
    rgba(245,208,97,.16) 60% 63%, transparent 65% 83%,
    rgba(255,243,196,.12) 85% 88%, transparent 90%);
  animation:beamSpin 26s linear infinite;
}
.beams i:nth-child(2){animation-direction:reverse;animation-duration:34s;opacity:.7}
@keyframes beamSpin{to{transform:rotate(360deg)}}
.flipping .beams{opacity:1}
.flipping .beams i{animation-duration:2.2s}
.flipping .beams i:nth-child(2){animation-duration:3s}

.rays{position:absolute;inset:-30%;pointer-events:none;opacity:0;
  background:conic-gradient(from 0deg,
    rgba(255,243,196,.5) 0 4%, transparent 4% 10%, rgba(245,208,97,.45) 10% 14%,
    transparent 14% 20%, rgba(255,243,196,.5) 20% 24%, transparent 24% 30%,
    rgba(245,208,97,.45) 30% 34%, transparent 34% 40%, rgba(255,243,196,.5) 40% 44%,
    transparent 44% 50%, rgba(245,208,97,.45) 50% 54%, transparent 54% 60%,
    rgba(255,243,196,.5) 60% 64%, transparent 64% 70%, rgba(245,208,97,.45) 70% 74%,
    transparent 74% 80%, rgba(255,243,196,.5) 80% 84%, transparent 84% 90%,
    rgba(245,208,97,.45) 90% 94%, transparent 94%);
  -webkit-mask:radial-gradient(circle, #000 0%, transparent 68%);
  mask:radial-gradient(circle, #000 0%, transparent 68%);
}
.rays.go{animation:raysBlast 1.6s ease-out}
@keyframes raysBlast{
  0%{opacity:0;transform:scale(.3) rotate(0)}
  15%{opacity:1}
  100%{opacity:0;transform:scale(1.6) rotate(60deg)}
}

.strobe{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;background:rgba(245,208,97,.1)}
.flipping ~ .strobe, .strobe.go{animation:strobe .38s steps(2) infinite}
@keyframes strobe{50%{opacity:1}}

.tint{position:fixed;inset:0;pointer-events:none;z-index:18;opacity:0}
.tint.win{background:radial-gradient(circle at 50% 40%, rgba(89,255,163,.25), transparent 70%);animation:tint 1.4s ease-out}
.tint.loss{background:radial-gradient(circle at 50% 40%, rgba(255,77,94,.3), transparent 70%);animation:tint 1s ease-out}
@keyframes tint{15%{opacity:1}100%{opacity:0}}

.mute{
  width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px;
  color:var(--gold-2);background:rgba(245,208,97,.06);
  border:1px solid rgba(245,208,97,.25);transition:all .2s;
}
.mute.off{color:var(--dim);opacity:.5;text-decoration:line-through}
.mute:active{transform:scale(.92)}

/* ── jackpot celebration ── */
.banner{
  position:fixed;left:-4%;right:-4%;top:14%;z-index:32;pointer-events:none;
  transform:rotate(-3deg) scaleX(0);opacity:0;
  background:linear-gradient(180deg,#2a1c04,#171004);
  border-top:4px solid var(--gold-2);border-bottom:4px solid var(--gold-2);
  box-shadow:0 0 60px rgba(245,208,97,.5), inset 0 0 40px rgba(245,208,97,.15);
  padding:10px 0 6px;text-align:center;
}
.banner::before,.banner::after{ /* chasing marquee bulbs */
  content:"";position:absolute;left:0;right:0;height:8px;
  background-image:radial-gradient(circle 3px, var(--gold-1) 45%, transparent 50%);
  background-size:26px 8px;
  animation:chase .35s steps(2) infinite;
}
.banner::before{top:6px}
.banner::after{bottom:6px;animation-delay:.17s}
@keyframes chase{50%{background-position-x:13px}}
.banner .btext{
  font-family:'Bebas Neue';font-size:min(17vw,84px);line-height:1;letter-spacing:.22em;text-indent:.22em;
  background:linear-gradient(178deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(245,208,97,.8));
  animation:btextPulse .5s ease-in-out infinite alternate;
}
@keyframes btextPulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.banner.go{animation:bannerIn 4.4s cubic-bezier(.2,1.3,.3,1) forwards}
@keyframes bannerIn{
  0%{transform:rotate(-3deg) scaleX(0);opacity:0}
  8%{transform:rotate(-3deg) scaleX(1.06);opacity:1}
  12%{transform:rotate(-3deg) scaleX(1)}
  88%{transform:rotate(-3deg) scaleX(1);opacity:1}
  100%{transform:rotate(-3deg) scaleX(1) translateY(-30px);opacity:0}
}

/* shadow under coin */
.coin-shadow{
  position:absolute;left:50%;bottom:-12%;width:60%;height:26px;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.7), transparent);
  filter:blur(6px);
  transition:transform .3s, opacity .3s;
}

/* ── controls ── */
.controls{width:100%;display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side-btn{
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.18em;
  padding:16px 0 13px;border-radius:16px;cursor:pointer;
  color:var(--dim);background:rgba(255,255,255,.03);
  border:1px solid rgba(245,208,97,.16);
  transition:all .18s ease;
}
.side-btn.sel{
  color:#241703;
  background:linear-gradient(180deg, var(--gold-1), var(--gold-2) 45%, var(--gold-3));
  border-color:var(--gold-1);
  box-shadow:0 6px 26px rgba(212,160,32,.4), inset 0 1px 0 #fffbe8;
  transform:translateY(-2px);
}
.wager-row{display:flex;align-items:center;justify-content:center;gap:10px}
.wagers{display:flex;gap:8px;width:100%}
.wagers .wg{flex:1}
.wg{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
  min-width:48px;padding:9px 0;border-radius:12px;cursor:pointer;
  color:var(--dim);background:transparent;border:1px solid rgba(245,208,97,.18);
  transition:all .15s;
}
.wg.sel{color:var(--gold-1);border-color:var(--gold-2);background:rgba(245,208,97,.1);box-shadow:0 0 16px rgba(245,208,97,.18) inset}

/* ── deposit sheet ── */
.scrim{
  position:fixed;inset:0;background:rgba(4,3,7,.72);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;
}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:460px;margin:0 auto;
  background:linear-gradient(180deg,#151020,#0c0913);
  border:1px solid rgba(245,208,97,.25);border-bottom:none;
  border-radius:26px 26px 0 0;
  padding:26px 24px calc(30px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .42s cubic-bezier(.22,1.2,.3,1);
}
.sheet.open{transform:translateY(0)}
.sheet{max-height:90dvh;overflow-y:auto}
.backbtn{
  background:none;border:none;cursor:pointer;padding:0 0 12px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;
  color:var(--dim);
}
#checkoutMount{min-height:430px;border-radius:14px;overflow:hidden;background:#fff}
.chip.busy{opacity:.45;pointer-events:none}
.sheet h2{font-family:'Bebas Neue';font-size:30px;letter-spacing:.16em;color:var(--gold-2)}
.sheet p{font-size:12px;color:var(--dim);margin:6px 0 20px;letter-spacing:.06em}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.chip{
  aspect-ratio:1;border-radius:50%;cursor:pointer;position:relative;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;color:#2a1c04;
  background:
    radial-gradient(closest-side, #f7dd7e 68%, #caa32c 69% 100%),
    conic-gradient(#f5d061 0 12%, #241a06 12% 13%, #f5d061 13% 25%, #241a06 25% 26%, #f5d061 26% 37%, #241a06 37% 38%, #f5d061 38% 50%, #241a06 50% 51%, #f5d061 51% 62%, #241a06 62% 63%, #f5d061 63% 75%, #241a06 75% 76%, #f5d061 76% 87%, #241a06 87% 88%, #f5d061 88% 100%);
  border:none;
  box-shadow:0 8px 20px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,252,232,.7), inset 0 -4px 8px rgba(90,60,8,.45);
  transition:transform .14s;
  display:flex;align-items:center;justify-content:center;
}
.chip::before{
  content:"";position:absolute;inset:14%;border-radius:50%;
  border:2px dashed rgba(90,60,8,.55);
}
.chip:active{transform:scale(.9) rotate(-8deg)}
.chip span{position:relative;text-shadow:0 1px 0 #ffefad}

/* ── result layer ── */
.flash{
  position:fixed;inset:0;background:radial-gradient(circle at 50% 42%, rgba(255,244,200,.95), rgba(245,208,97,.35) 45%, transparent 75%);
  opacity:0;pointer-events:none;z-index:20;
}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{12%{opacity:1}100%{opacity:0}}
.ring{
  position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;
  border:3px solid var(--gold-1);transform:translate(-50%,-50%);
  opacity:0;pointer-events:none;
}
.ring.go{animation:ring .8s cubic-bezier(.1,.7,.3,1)}
@keyframes ring{
  0%{opacity:1;width:20px;height:20px;border-width:6px}
  100%{opacity:0;width:min(90vw,420px);height:min(90vw,420px);border-width:1px}
}
.verdict{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;z-index:30;gap:2px;
}
.verdict .word{
  font-family:'Bebas Neue';font-size:min(26vw,120px);letter-spacing:.1em;line-height:1;
  opacity:0;transform:scale(2.6);
  background:linear-gradient(178deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(245,208,97,.55));
}
.verdict .payout{
  font-family:'IBM Plex Mono';font-weight:700;font-size:24px;opacity:0;transform:translateY(14px);
}
.verdict .payout.win{color:var(--win);text-shadow:0 0 22px rgba(89,255,163,.5)}
.verdict .payout.loss{color:var(--loss);text-shadow:0 0 22px rgba(255,77,94,.4)}
.verdict.go .word{animation:stamp .7s cubic-bezier(.2,1.4,.3,1) forwards}
.verdict.go .payout{animation:rise .5s .28s ease-out forwards}
@keyframes stamp{
  0%{opacity:0;transform:scale(2.6) rotate(-4deg)}
  60%{opacity:1;transform:scale(.94) rotate(1deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.verdict.out .word{animation:fadeUp .45s ease-in forwards}
.verdict.out .payout{animation:fadeUp .45s ease-in forwards}
@keyframes fadeUp{to{opacity:0;transform:translateY(-26px) scale(.92)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25}

/* ── win celebration extras ── */
.coin-wrap{transition:filter .5s}
.stage.win .coin-wrap{filter:drop-shadow(0 0 34px rgba(245,208,97,.75))}
.stage.win .beams{opacity:.95}
.stage.win .beams i{animation-duration:5s}
.stage.win .beams i:nth-child(2){animation-duration:7s}
.coin-wrap.winpop{animation:winPop .85s cubic-bezier(.16,1.5,.3,1)}
@keyframes winPop{35%{transform:scale(1.15)}70%{transform:scale(.97)}}
.edgeglow{
  position:fixed;inset:0;pointer-events:none;z-index:16;opacity:0;
  box-shadow:inset 0 0 110px 24px rgba(245,208,97,.32), inset 0 0 30px rgba(255,243,196,.2);
}
.edgeglow.go{animation:edgePulse .82s ease-in-out 5}
@keyframes edgePulse{50%{opacity:1}}

/* ── payment toast ── */
.toast{
  position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));z-index:60;
  transform:translate(-50%,-30px);opacity:0;pointer-events:none;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.08em;
  color:var(--gold-1);background:rgba(21,16,32,.92);
  border:1px solid rgba(245,208,97,.45);border-radius:999px;padding:10px 18px;
  box-shadow:0 8px 30px rgba(0,0,0,.5), 0 0 24px rgba(245,208,97,.25);
  white-space:nowrap;
}
.toast.go{animation:toastIn 3.4s cubic-bezier(.2,1,.3,1) forwards}
@keyframes toastIn{
  10%{transform:translate(-50%,0);opacity:1}
  82%{transform:translate(-50%,0);opacity:1}
  100%{transform:translate(-50%,-30px);opacity:0}
}
.sheet .fine{margin:18px 2px 0;font-size:10px;line-height:1.7;color:var(--dim);letter-spacing:.05em}

.shake{animation:shake .45s ease}
@keyframes shake{
  20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}
  60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.15s !important}
}
</style>
</head>
<body>
<div class="table"></div>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>
<div class="strobe" id="strobe"></div>
<div class="tint" id="tint"></div>
<div class="edgeglow" id="edgeglow"></div>

<div class="stage idle" id="stage">
  <header>
    <div class="wordmark">DEGEN</div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="mute" id="mute" aria-label="Toggle music">♪</button>
      <div class="bank" id="bank">
        <div class="lbl">DEGEN COINS</div>
        <div class="amt" id="balance">0</div>
      </div>
    </div>
  </header>

  <div class="arena">
    <div class="beams" aria-hidden="true"><i></i><i></i></div>
    <div class="rays" id="rays" aria-hidden="true"></div>
    <div class="ring" id="ring"></div>
    <div class="ring" id="ring2"></div>
    <div class="ring" id="ring3"></div>
    <div class="hop" id="hop">
      <div class="coin-wrap" id="coinWrap">
        <div class="coin" id="coin">
          <div class="face heads">
            <div class="glyph">H</div>
          </div>
          <div class="face tails">
            <div class="glyph">T</div>
          </div>
        </div>
        <div class="sheen"></div>
        <div class="coin-shadow" id="coinShadow"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="sides">
      <button class="side-btn sel" id="btnHeads" data-side="heads">HEADS</button>
      <button class="side-btn" id="btnTails" data-side="tails">TAILS</button>
    </div>
    <div class="wager-row">
      <div class="wagers" id="wagers">
        <button class="wg sel" data-w="1">1</button>
        <button class="wg" data-w="5">5</button>
        <button class="wg" data-w="10">10</button>
        <button class="wg" data-w="20">20</button>
      </div>
    </div>
  </div>
</div>

<div class="verdict" id="verdict">
  <div class="word" id="verdictWord">HEADS</div>
  <div class="payout" id="verdictPay">+0</div>
</div>
<div class="banner" id="banner"><div class="btext" id="bannerText">WINNER</div></div>
<div class="toast" id="toast"></div>

      this page is hosted, with the coin amount appended:

      localStorage doesn't cross origins, the balance would vanish).

   popup credits the coins to localStorage and closes itself → the

   Until links are pasted in, chips grant free demo coins.
   Balance persists in localStorage where available.
   Degen Coins never convert back to dollars — play money only.
   Honor-system caveat: with no server, ?coins=N typed by hand also

function setBalance(v, animate=true){
  const from=balance; balance=v; saveBal();
  if(!animate || reduced){ balanceEl.textContent=''+balance; return; }
  const t0=performance.now(), dur=600;
  (function tick(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    balanceEl.textContent=''+Math.round(from+(v-from)*e);
    if(p<1) requestAnimationFrame(tick);
  })(t0);
  bank.classList.remove('pulse'); void bank.offsetWidth; bank.classList.add('pulse');
}

/* ── buying coins: embedded checkout with popup fallback ── */
const chipsGrid=$('chipsGrid'), checkoutBox=$('checkoutBox'), checkoutMount=$('checkoutMount');
let currentCheckout=null, stripeJs=null;
function loadStripeJs(){
  if(stripeJs) return stripeJs;
  stripeJs=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://js.stripe.com/v3/'; s.async=true;
    s.onload=res; s.onerror=()=>{ stripeJs=null; rej(new Error('stripe.js failed')); };
    document.head.appendChild(s);
  });
  stripeJs.catch(()=>{}); /* pre-warm callers may ignore a failed load */
  return stripeJs;
}
function resetCheckoutUI(){
  if(currentCheckout){ try{ currentCheckout.destroy(); }catch(e){} currentCheckout=null; }
  checkoutBox.hidden=true; chipsGrid.style.display='';
  checkoutMount.innerHTML='';
}
$('backToChips').onclick=resetCheckoutUI;
function creditPurchase(coins){
  setBalance(balance + coins); chime();
  toast.textContent=`PAYMENT RECEIVED · +${coins} DEGEN COIN${coins>1?'S':''}`;
  toast.classList.remove('go'); void toast.offsetWidth; toast.classList.add('go');
  setTimeout(()=>toast.classList.remove('go'), 3600);
  track('coins_purchased', {coins, method:'embedded'});
}
async function embeddedCheckout(amt){
  const jsReady=loadStripeJs();
  const res=await fetch('/api/create-checkout-session', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({coins:amt})
  });
  if(!res.ok) throw new Error('session endpoint '+res.status);
  const {clientSecret}=await res.json();
  if(!clientSecret) throw new Error('no client secret');
  await jsReady;
  const sessionId=clientSecret.split('_secret')[0];
  const checkout=await Stripe(STRIPE_PK).initEmbeddedCheckout({
    clientSecret,
    onComplete: async ()=>{
      let coins=amt;
      try{ /* confirm with the backend that this session really paid */
        const v=await fetch('/api/session-status?session_id='+encodeURIComponent(sessionId)).then(r=>r.json());
        if(v && v.status==='complete') coins=v.coins||amt; else return;
      }catch(e){}
      resetCheckoutUI();
      creditPurchase(coins);
      setTimeout(closeSheet, 700);
    }
  });
  currentCheckout=checkout;
  chipsGrid.style.display='none'; checkoutBox.hidden=false;
  checkout.mount('#checkoutMount');
}
function popupFlow(amt){
  const link=PAY_LINKS[amt];
  if(link){
    saveBal(); awaitingPurchase=true;
    /* checkout in a popup keeps the table alive behind it */
    const w=window.open(link, 'degen_pay', 'popup,width=480,height=780');
    track('checkout_opened', {usd: amt, method: w?'popup':'redirect'});
    if(!w) location.href=link; /* popup blocked → classic same-tab redirect */
    return;
  }
  setBalance(balance + amt); closeSheet(); chime();  /* demo mode when no link set */
}
document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{
    const amt=+c.dataset.amt;
    if(STRIPE_PK){
      c.classList.add('busy');
      track('checkout_opened', {usd: amt, method:'embedded'});
      embeddedCheckout(amt)
        .catch(()=>popupFlow(amt))  /* backend not ready → payment-link popup */
        .finally(()=>c.classList.remove('busy'));
      return;
    }
    popupFlow(amt);
  };
});
/* returning from Stripe: credit purchased Degen Coins */
(function(){
  const q=new URLSearchParams(location.search);
  const bought=Math.min(1000, Math.floor(+q.get('coins')||0)); /* sane cap */
  if(bought>0){
    setBalance(balance + bought);
    history.replaceState({}, '', location.pathname); /* clean ?coins=N off the URL */
    toast.textContent=`PAYMENT RECEIVED · +${bought} DEGEN COIN${bought>1?'S':''}`;
    toast.classList.add('go');
    setTimeout(()=>toast.classList.remove('go'), 3600);
    /* if this page IS the checkout popup, hand coins to the table and bow out.
       window.name survives the round trip through Stripe, opener may not */
    let popup = (window.name==='degen_pay');
    try{ popup = popup || !!(window.opener && !window.opener.closed); }catch(e){ popup=true; }
    if(popup){
      toast.textContent=`+${bought} DEGEN COIN${bought>1?'S':''} — BACK TO YOUR TABLE`;
      setTimeout(()=>{
        window.close();
        /* some browsers refuse to close a navigated popup — leave a clear exit */
        setTimeout(()=>{
          toast.style.animation='none'; toast.style.opacity='1';
          toast.style.transform='translate(-50%,0)';
          toast.textContent='PAID ✓ — CLOSE THIS WINDOW TO RETURN TO YOUR TABLE';
        }, 400);
      }, 1400);
    } else {
      track('coins_purchased', {coins: bought}); /* same-tab return; popup flow is tracked by the table */
    }
  }
})();
/* the open table live-syncs coins credited by the popup (or another tab) */
addEventListener('storage', e=>{
  if(e.key!=='degen_bal') return;
  const v=Math.max(0, +e.newValue||0);
  if(v===balance) return;
  if(flipping){ balance=v; return; } /* fold in quietly; the flip settles on top */
  const gained=v-balance;
  setBalance(v);
  if(gained>0){
    if(awaitingPurchase){ awaitingPurchase=false; track('coins_purchased', {coins: gained}); }
    closeSheet(); chime();
    toast.textContent=`PAYMENT RECEIVED · +${gained} DEGEN COIN${gained>1?'S':''}`;
    toast.classList.remove('go'); void toast.offsetWidth; toast.classList.add('go');
    setTimeout(()=>toast.classList.remove('go'), 3600);
  }
});

fit(); addEventListener('resize',fit);
let parts=[], dust=[];
for(let i=0;i<40;i++) dust.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight,
  s:.6+Math.random()*1.8, vy:-(.08+Math.random()*.25), vx:(Math.random()-.5)*.15,

function burst(win){
  const cx=innerWidth/2, cy=innerHeight*0.42;
  const golds=['#fff3c4','#f5d061','#c9931a','#ffe89a','#b8860b'];
  const n = win?160:36;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(win?7:4)+Math.random()*(win?10:4);
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(win?4:2),
      s:3+Math.random()*5, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.4,
      c:win?golds[i%golds.length]:'rgba(150,150,160,.8)', life:1, coin:Math.random()<.35&&win});
  }
}
/* twinkling 4-point star glints */
function spawnStars(n, cx, cy, spread){
  for(let i=0;i<n;i++){
    parts.push({x:cx+(Math.random()-.5)*spread, y:cy+(Math.random()-.5)*spread*.8,
      vx:(Math.random()-.5)*.6, vy:-.2-Math.random()*.6,
      s:4+Math.random()*6, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.06,
      ph:Math.random()*7, c:Math.random()<.5?'#fff3c4':'#ffffff',
      life:.9+Math.random()*.5, star:true});
  }
}
/* confetti cannons from the bottom corners — ribbons, coins, squares */
function cannon(fromLeft){
  const x=fromLeft?-10:innerWidth+10, y=innerHeight+10;
  const base=fromLeft? -Math.PI*.32 : -Math.PI*.68;
  const golds=['#fff3c4','#f5d061','#c9931a','#ffe89a','#fffbe8'];
  for(let i=0;i<44;i++){
    const a=base+(Math.random()-.5)*Math.PI*.22, sp=9+Math.random()*8;
    const kind=Math.random();
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      s:3+Math.random()*5, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.35,
      ph:Math.random()*7, c:golds[i%golds.length], life:1.15+Math.random()*.4,
      ribbon:kind<.3, coin:kind>=.3&&kind<.55});
  }
}
/* winnings physically fly from the coin into the bank, one ding each */
function flyToBank(n, done){
  const r=bank.getBoundingClientRect();
  const tx=r.left+r.width/2, ty=r.top+r.height/2;
  const cx=innerWidth/2, cy=innerHeight*.42;
  let arrived=0;
  for(let i=0;i<n;i++){
    parts.push({fly:true, t:-i*.09, dur:.75+Math.random()*.35, life:1, ph:Math.random()*7,
      x0:cx+(Math.random()-.5)*90, y0:cy+(Math.random()-.5)*70,
      mx:cx+(Math.random()-.5)*innerWidth*.7, my:cy-120-Math.random()*160,
      x1:tx, y1:ty, x:cx, y:cy, s:6+Math.random()*3,
      cb:()=>{ arrived++; ding(arrived);
        bank.classList.remove('pulse'); void bank.offsetWidth; bank.classList.add('pulse');
        if(arrived===n && done) done(); }});
  }
}
function coinRain(){
  const golds=['#fff3c4','#f5d061','#e8bc3f'];
  for(let i=0;i<50;i++){
    parts.push({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.6,
      vx:(Math.random()-.5)*1.2, vy:3+Math.random()*4,
      s:5+Math.random()*7, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:golds[i%3], life:1.6, coin:true});
  }
}
/* canvas fireworks */
function firework(x,y){
  const cols=['#fff3c4','#f5d061','#ffffff','#ffe89a','#e8bc3f'];
  const c=cols[Math.floor(Math.random()*cols.length)];
  for(let i=0;i<46;i++){
    const a=(i/46)*Math.PI*2, sp=3.5+Math.random()*4.5;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      s:2+Math.random()*3, r:0, vr:0, c, life:.9+Math.random()*.3, coin:false});
  }
}
function fireworkShow(){
  for(let i=0;i<7;i++){
    setTimeout(()=>{

      if(musicOn&&AC){const t=AC.currentTime; noise(t,.25,.12,2500);

(function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  /* ambient floating gold dust */
  const t=performance.now()/1000;
  for(const d of dust){
    d.y+=d.vy; d.x+=d.vx+Math.sin(t+d.ph)*.15;
    if(d.y<-4){d.y=innerHeight+4; d.x=Math.random()*innerWidth;}
    ctx.globalAlpha=d.a*(0.6+0.4*Math.sin(t*2+d.ph));
    ctx.fillStyle='#f5d061';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    /* homing coins: quadratic bezier from coin to bank, sparkling as they go */
    if(p.fly){
      p.t+=0.0166/p.dur;
      if(p.t>=1){ if(!p.done){ p.done=1; p.life=0; p.cb&&p.cb(); } continue; }
      if(p.t<=0) continue; /* staggered launch */
      const u=p.t*p.t*(3-2*p.t), v=1-u;
      p.x=v*v*p.x0 + 2*v*u*p.mx + u*u*p.x1;
      p.y=v*v*p.y0 + 2*v*u*p.my + u*u*p.y1;
      ctx.save(); ctx.translate(p.x,p.y);
      ctx.shadowColor='rgba(245,208,97,.9)'; ctx.shadowBlur=14;
      ctx.fillStyle='#f5d061';
      ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*(.35+.65*Math.abs(Math.sin(u*10+p.ph))),u*3,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#fff3c4';
      ctx.beginPath(); ctx.arc(-p.s*.3,-p.s*.3,p.s*.28,0,7); ctx.fill();
      ctx.restore();
      continue;
    }
    if(p.star){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.016; }
    else if(p.ribbon){ p.vy+=0.11; p.vy*=.985; p.vx*=.972; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.009; }
    else { p.vy+=0.28; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx*=.985; p.life-=0.011; }
    ctx.save(); ctx.globalAlpha=Math.min(1,Math.max(0,p.life)); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c;
    if(p.star){
      ctx.globalAlpha=Math.min(1,Math.max(0,p.life))*(.4+.6*Math.abs(Math.sin(p.life*22+p.ph)));
      ctx.beginPath();
      for(let i=0;i<8;i++){ const rr=i%2?p.s*.32:p.s, a=i*Math.PI/4; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); }
      ctx.closePath(); ctx.fill();
    }
    else if(p.ribbon){
      ctx.scale(1,.35+.65*Math.abs(Math.sin(p.life*9+p.ph)));
      ctx.fillRect(-p.s*.45,-p.s*1.4,p.s*.9,p.s*2.8);
    }
    else if(p.coin){ ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*Math.abs(Math.sin(p.r*3)),0,0,7); ctx.fill(); }
    else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.4);
    ctx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ── music + sfx (synthesized, no files) ── */
let AC=null, master=null, musicBus=null, musicOn=true, schedTimer=null;
function audio(){
  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination);
    /* music gets its own bus so mute can cut already-scheduled notes instantly */
    musicBus=AC.createGain(); musicBus.gain.value=1; musicBus.connect(master); }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq, t0, dur, type='sine', vol=.2, dest=master){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+.05);
}
function noise(t0, dur, vol=.15, hp=6000, dest=master){
  const len=AC.sampleRate*dur, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t0);
}
/* looping lounge groove: swung bass + hats + sparkle arp, A minor */
const BPM=104, BEAT=60/BPM;
const bassLine=[110,110,164.8,110, 130.8,130.8,98,110];     /* A A E A · C C G A */
const arp=[440,523.3,659.3,880, 659.3,523.3, 587.3,493.9];
let bar=0;
function scheduleBar(t0){
  for(let b=0;b<8;b++){
    const t=t0+b*BEAT/2;
    /* kick on 1 & 3 */
    if(b%4===0){ const o=AC.createOscillator(),g=AC.createGain();
      o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+.12);
      g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+.25); }
    /* hats every 8th, accented offbeats */
    noise(t, .04, b%2? .07:.035, 8000, musicBus);
    /* bass */
    tone(bassLine[b], t, BEAT*.42, 'triangle', .22, musicBus);
    /* sparkle arp every other bar */
    if(bar%2===1) tone(arp[b]* (bar%4===3?1.5:1), t, .3, 'sine', .05, musicBus);
  }
  bar++;
}
function startMusic(){
  if(!musicOn || reduced) return;
  audio();
  musicBus.gain.cancelScheduledValues(AC.currentTime);
  musicBus.gain.setValueAtTime(1, AC.currentTime);
  const barLen=BEAT*4;
  let next=AC.currentTime+.05;
  scheduleBar(next);
  clearInterval(schedTimer);
  schedTimer=setInterval(()=>{
    while(next+barLen < AC.currentTime+barLen*1.5){ next+=barLen; scheduleBar(next); }
  }, 200);
}
function stopMusic(){
  clearInterval(schedTimer); schedTimer=null;
  /* kill notes already scheduled ahead, not just future bars */
  if(AC && musicBus){
    musicBus.gain.cancelScheduledValues(AC.currentTime);
    musicBus.gain.setValueAtTime(0, AC.currentTime);
  }
}
muteBtn.onclick=()=>{
  musicOn=!musicOn;
  muteBtn.classList.toggle('off',!musicOn);
  musicOn ? startMusic() : stopMusic();
};
/* start on first interaction (browser autoplay rules) */
addEventListener('pointerdown', function boot(){ startMusic(); removeEventListener('pointerdown',boot); }, {once:true});

function chime(){ if(!musicOn)return; audio(); const t=AC.currentTime;
  [523.3,659.3,784].forEach((f,i)=>tone(f,t+i*.06,.25,'sine',.15)); }
function riser(dur){ if(!musicOn)return; audio();
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(80,t);
  o.frequency.exponentialRampToValueAtTime(1400,t+dur);
  g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.12,t+dur*.9);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2200;
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur);
  /* tick-tick-tick accelerating */
  for(let i=0;i<14;i++){ const tt=t+dur*(1-Math.pow(1-i/14,2)); noise(tt,.03,.1,5000); }
}
/* ascending register dings as each coin lands in the bank */
const DINGS=[659.3,784,880,1046.5,1174.7,1318.5,1568,1760,2093,2349];
function ding(i){ if(!musicOn)return; audio(); const t=AC.currentTime;
  const f=DINGS[Math.min(i-1,DINGS.length-1)];
  tone(f,t,.16,'sine',.12); tone(f*2,t,.1,'sine',.04); }
function shimmer(){ if(!musicOn)return; audio(); const t=AC.currentTime;
  for(let i=0;i<10;i++) tone(1200+i*180, t+i*.03, .12, 'sine', .035);
  noise(t,.35,.06,6000); }
function winJingle(){ if(!musicOn)return; audio(); const t=AC.currentTime;
  [523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>{
    tone(f,t+i*.09,.5,'square',.09); tone(f/2,t+i*.09,.5,'triangle',.12); });
  noise(t,.5,.08,3000); }
function loseThud(){ if(!musicOn)return; audio(); const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(45,t+.4);
  g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.001,t+.5);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.55);
  tone(155.6,t+.1,.7,'sawtooth',.06); tone(146.8,t+.1,.7,'sawtooth',.06); }

/* ── the toss ── */
function doToss(){
  if(flipping || balance<wager) return;
  flipping=true;
  stage.classList.remove('idle'); stage.classList.add('flipping');
  /* nothing is taken up front — the whole ±wager settles at the reveal */

  /* 45% chance the player's pick hits, 55% the house takes it */
  const win = Math.random() < 0.45;
  const result = win ? side : (side==='heads' ? 'tails' : 'heads');
  const spins = 6 + Math.floor(Math.random()*3);
  const current = rot % 360;
  const targetFace = result==='heads'?0:180;
  rot += spins*360 + ((targetFace - (rot%360)) + 360) % 360;

  const dur = reduced ? 0.3 : 2.7;
  if(!reduced){ strobe.classList.add('go'); }
  riser(dur);
  /* hop physics */
  hop.animate([
    {transform:'translateY(0)'},
    {transform:'translateY(-38vh)', offset:.42, easing:'cubic-bezier(.33,1,.68,1)'},
    {transform:'translateY(0)', easing:'cubic-bezier(.55,0,.8,.6)'},
    {transform:'translateY(-5vh)', offset:.93, easing:'ease-out'},
    {transform:'translateY(0)'}
  ],{duration:dur*1000, fill:'forwards'});
  shadow.animate([
    {transform:'translateX(-50%) scale(1)', opacity:1},
    {transform:'translateX(-50%) scale(.45)', opacity:.35, offset:.42},
    {transform:'translateX(-50%) scale(1)', opacity:1}
  ],{duration:dur*1000});

  coin.style.transition=`transform ${dur}s cubic-bezier(.18,.85,.22,1)`;
  requestAnimationFrame(()=>coin.style.transform=`rotateX(${rot}deg)`);

  setTimeout(()=>reveal(result), dur*1000);
}

/* staggered shockwave rings */
const rings=[ring, $('ring2'), $('ring3')];
function ringBlast(n){
  rings.slice(0,n).forEach((r,i)=>setTimeout(()=>{
    r.classList.remove('go'); void r.offsetWidth; r.classList.add('go');
  }, i*150));
}
/* payout ticks up instead of appearing */
function countPayout(target){
  const t0=performance.now(), dur=650;
  (function tick(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    verdictPay.textContent='+'+Math.round(target*e);
    if(p<1) requestAnimationFrame(tick);
  })(t0);
}

function reveal(result){
  const win = result===side; /* net outcome is exactly ±wager */
  track('coin_flip', {wager, side, result, win, balance_after: win ? balance+wager : balance-wager});
  strobe.classList.remove('go');
  /* impact */
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  ringBlast(win?3:1);
  if(!reduced){ stage.classList.add('shake'); setTimeout(()=>stage.classList.remove('shake'),480); }
  burst(win);
  tint.className='tint '+(win?'win':'loss'); void tint.offsetWidth;
  const banner=$('banner');
  if(win){
    stage.classList.add('win'); /* coin glows gold, beams spin up */
    bannerText.textContent = wager>=20 ? 'JACKPOT' : 'WINNER';
    rays.classList.remove('go'); void rays.offsetWidth; rays.classList.add('go');
    setTimeout(()=>{rays.classList.remove('go'); void rays.offsetWidth; rays.classList.add('go');},1700);
    if(!reduced){
      coinWrap.classList.add('winpop'); setTimeout(()=>coinWrap.classList.remove('winpop'),900);
      edgeglow.classList.remove('go'); void edgeglow.offsetWidth; edgeglow.classList.add('go');
      spawnStars(16, innerWidth/2, innerHeight*.42, 260);
      cannon(true); cannon(false);
      if(wager>=10) setTimeout(()=>{ cannon(true); cannon(false); }, 900);
      coinRain(); setTimeout(coinRain,600); setTimeout(coinRain,1300); setTimeout(coinRain,2100);
      fireworkShow();
      banner.classList.remove('go'); void banner.offsetWidth; banner.classList.add('go');
    }
    winJingle(); shimmer(); setTimeout(winJingle,1400);
  } else {
    loseThud();
  }
  if(navigator.vibrate) navigator.vibrate(win?[30,40,80,60,120]:60);

  /* verdict stamp */
  verdictWord.textContent=result.toUpperCase();
  verdictPay.textContent = win ? '+0' : `-${wager}`;
  verdictPay.className = 'payout ' + (win?'win':'loss');
  verdict.classList.remove('out','go'); void verdict.offsetWidth; verdict.classList.add('go');
  if(win) setTimeout(()=>countPayout(wager), 300);

  /* win: coins fly into the bank, then the balance counts UP by the wager;
     loss: the balance drops by the wager at the moment of impact */
  if(win){
    pendingCredit = wager;
    const credit = ()=>{ if(!pendingCredit) return; const amt=pendingCredit; pendingCredit=0; setBalance(balance + amt); };
    if(reduced){ setTimeout(credit, 350); }
    else setTimeout(()=>flyToBank(Math.min(10, 4+Math.ceil(wager/4)), ()=>{
      credit();
      const r=bank.getBoundingClientRect();
      spawnStars(8, r.left+r.width/2, r.top+r.height/2, 80);
    }), 500);
  } else {
    setTimeout(()=>setBalance(balance - wager), 350);
  }

  const hold = win ? 4400 : 2100; /* wins party longer */
  setTimeout(()=>{
    verdict.classList.add('out');
    setTimeout(()=>verdict.classList.remove('go','out'), 500);
    banner.classList.remove('go');
    flipping=false;
    stage.classList.remove('flipping','win'); stage.classList.add('idle');
  }, hold);
}
