<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEGEN">
<link rel="manifest" href='data:application/manifest+json,{"name":"DEGEN","short_name":"DEGEN","display":"fullscreen","orientation":"portrait","background_color":"%2307060a","theme_color":"%2307060a","start_url":"/"}'>
<title>DEGEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07060a;
  --felt:#0d0a12;
  --gold-1:#fff3c4;
  --gold-2:#f5d061;
  --gold-3:#c9931a;
  --gold-4:#7a5410;
  --loss:#ff4d5e;
  --win:#59ffa3;
  --q:#a78bff;
  --text:#e9e2cf;
  --dim:#8d8571;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--ink);
  color:var(--text);
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
  overscroll-behavior:none;
}
/* ambient table */
.table{
  position:fixed;inset:0;
  background:
    radial-gradient(120% 90% at 50% 118%, rgba(201,147,26,.22), transparent 55%),
    radial-gradient(90% 70% at 50% -20%, rgba(245,208,97,.10), transparent 60%),
    radial-gradient(140% 140% at 50% 50%, var(--felt) 0%, var(--ink) 78%);
}
.table::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,243,196,.04) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(80% 70% at 50% 45%, #000 30%, transparent 100%);
  mask-image:radial-gradient(80% 70% at 50% 45%, #000 30%, transparent 100%);
}
.stage{
  position:relative;height:100%;max-width:460px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;
  padding:max(14px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom));
}
/* real phone viewport: track the dynamic toolbar so controls never sit under it */
@supports (height:100dvh){ html,body{height:100dvh} .stage{height:100dvh} }
/* short screens: shrink the chrome so everything fits without scrolling */
@media (max-height:720px){
  .wordmark{font-size:34px}
  .coin{--d:min(52vw,200px)}
  .controls{gap:9px}
  .side-btn{font-size:21px;padding:11px 0 9px;border-radius:13px}
  .wg{min-width:44px;padding:7px 0;font-size:13px}
  .bank{padding:6px 12px}
  .bank .amt{font-size:18px}
  .mute{width:36px;height:36px;font-size:15px}
}

/* ── header ── */
header{width:100%;display:flex;align-items:flex-end;justify-content:space-between}
.wordmark{
  font-family:'Bebas Neue',sans-serif;
  font-size:44px;line-height:.9;letter-spacing:.14em;
  background:linear-gradient(178deg, var(--gold-1) 8%, var(--gold-2) 38%, var(--gold-3) 62%, var(--gold-4) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(201,147,26,.35));
  animation:markGlow 3.4s ease-in-out infinite;
}
@keyframes markGlow{50%{filter:drop-shadow(0 2px 22px rgba(245,208,97,.7))}}
.bank{
  text-align:right;cursor:pointer;border:1px solid rgba(245,208,97,.22);
  border-radius:14px;padding:8px 14px;background:rgba(245,208,97,.05);
  transition:border-color .2s, transform .15s;
}
.bank:active{transform:scale(.96)}
.bank .lbl{font-size:9px;letter-spacing:.3em;color:var(--dim)}
.bank .amt{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px;
  color:var(--gold-2);text-shadow:0 0 18px rgba(245,208,97,.35);
  font-variant-numeric:tabular-nums;
}
.bank.pulse{animation:bankPulse .5s ease}
@keyframes bankPulse{40%{border-color:var(--gold-2);box-shadow:0 0 0 6px rgba(245,208,97,.12)}}

/* ── coin arena ── */
.arena{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.hop{will-change:transform}
.coin-wrap{perspective:1100px;cursor:pointer;position:relative}
.coin{
  --d:min(62vw,250px);
  width:var(--d);height:var(--d);position:relative;
  transform-style:preserve-3d;
  transition:transform 0s;
  will-change:transform;
}
.idle .hop{animation:float 4.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.face{
  position:absolute;inset:0;border-radius:50%;
  backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;
  background:
    radial-gradient(circle at 35% 30%, #ffe9a0 0%, #f0c94e 42%, #d4a428 68%, #b8860b 100%);
  box-shadow:
    inset 0 0 0 5px #c9931a,
    inset 0 0 0 8px #f7dd7e,
    inset 0 -14px 24px rgba(90,60,8,.4),
    inset 0 12px 22px rgba(255,248,214,.45),
    0 24px 60px rgba(0,0,0,.65),
    0 0 90px rgba(212,160,32,.25);
}
.face::before{ /* inner beaded ring, like a real coin */
  content:"";position:absolute;inset:9%;border-radius:50%;
  border:2px solid rgba(122,84,16,.5);
  box-shadow:inset 0 0 0 2px rgba(255,243,196,.4);
}
.face .glyph{
  font-size:calc(var(--d)*.5);line-height:1;
  color:#8a6210;
  text-shadow:0 2px 0 #ffefad, 0 -2px 2px rgba(60,38,4,.6);
  transform:translateY(2%);
}
.face .qmark{ /* every Degen Coin carries the wavefunction */
  position:absolute;bottom:13%;left:50%;transform:translateX(-50%);
  font-family:'IBM Plex Mono',monospace;font-weight:700;
  font-size:calc(var(--d)*.1);line-height:1;color:#8a6210;
  text-shadow:0 1px 0 #ffefad;opacity:.85;
}
.face.tails{transform:rotateX(180deg)}
/* shimmer sweep on idle */
.sheen{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;
}
.sheen::after{
  content:"";position:absolute;top:-30%;bottom:-30%;width:34%;left:-60%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
  transform:skewX(-18deg);
  animation:sweep 3.6s ease-in-out infinite;
}
@keyframes sweep{0%,55%{left:-60%}85%,100%{left:130%}}
.flipping .sheen::after{animation:none}

/* ── light show ── */
.beams{position:absolute;inset:-40%;pointer-events:none;filter:blur(2px);opacity:.55}
.beams i{position:absolute;inset:0;
  background:conic-gradient(from 0deg,
    transparent 0 8%, rgba(245,208,97,.16) 10% 13%, transparent 15% 33%,
    rgba(255,243,196,.12) 35% 38%, transparent 40% 58%,
    rgba(245,208,97,.16) 60% 63%, transparent 65% 83%,
    rgba(255,243,196,.12) 85% 88%, transparent 90%);
  animation:beamSpin 26s linear infinite;
}
.beams i:nth-child(2){animation-direction:reverse;animation-duration:34s;opacity:.7}
@keyframes beamSpin{to{transform:rotate(360deg)}}
.flipping .beams{opacity:1}
.flipping .beams i{animation-duration:2.2s}
.flipping .beams i:nth-child(2){animation-duration:3s}

.rays{position:absolute;inset:-30%;pointer-events:none;opacity:0;
  background:conic-gradient(from 0deg,
    rgba(255,243,196,.5) 0 4%, transparent 4% 10%, rgba(245,208,97,.45) 10% 14%,
    transparent 14% 20%, rgba(255,243,196,.5) 20% 24%, transparent 24% 30%,
    rgba(245,208,97,.45) 30% 34%, transparent 34% 40%, rgba(255,243,196,.5) 40% 44%,
    transparent 44% 50%, rgba(245,208,97,.45) 50% 54%, transparent 54% 60%,
    rgba(255,243,196,.5) 60% 64%, transparent 64% 70%, rgba(245,208,97,.45) 70% 74%,
    transparent 74% 80%, rgba(255,243,196,.5) 80% 84%, transparent 84% 90%,
    rgba(245,208,97,.45) 90% 94%, transparent 94%);
  -webkit-mask:radial-gradient(circle, #000 0%, transparent 68%);
  mask:radial-gradient(circle, #000 0%, transparent 68%);
}
.rays.go{animation:raysBlast 1.6s ease-out}
@keyframes raysBlast{
  0%{opacity:0;transform:scale(.3) rotate(0)}
  15%{opacity:1}
  100%{opacity:0;transform:scale(1.6) rotate(60deg)}
}

.strobe{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;background:rgba(245,208,97,.1)}
.flipping ~ .strobe, .strobe.go{animation:strobe .38s steps(2) infinite}
@keyframes strobe{50%{opacity:1}}

.tint{position:fixed;inset:0;pointer-events:none;z-index:18;opacity:0}
.tint.win{background:radial-gradient(circle at 50% 40%, rgba(89,255,163,.25), transparent 70%);animation:tint 1.4s ease-out}
.tint.loss{background:radial-gradient(circle at 50% 40%, rgba(255,77,94,.3), transparent 70%);animation:tint 1s ease-out}
@keyframes tint{15%{opacity:1}100%{opacity:0}}

.mute{
  width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px;
  color:var(--gold-2);background:rgba(245,208,97,.06);
  border:1px solid rgba(245,208,97,.25);transition:all .2s;
}
.mute.off{color:var(--dim);opacity:.5;text-decoration:line-through}
.mute:active{transform:scale(.92)}

/* ── jackpot celebration ── */
.banner{
  position:fixed;left:-4%;right:-4%;top:14%;z-index:32;pointer-events:none;
  transform:rotate(-3deg) scaleX(0);opacity:0;
  background:linear-gradient(180deg,#2a1c04,#171004);
  border-top:4px solid var(--gold-2);border-bottom:4px solid var(--gold-2);
  box-shadow:0 0 60px rgba(245,208,97,.5), inset 0 0 40px rgba(245,208,97,.15);
  padding:10px 0 6px;text-align:center;
}
.banner::before,.banner::after{ /* chasing marquee bulbs */
  content:"";position:absolute;left:0;right:0;height:8px;
  background-image:radial-gradient(circle 3px, var(--gold-1) 45%, transparent 50%);
  background-size:26px 8px;
  animation:chase .35s steps(2) infinite;
}
.banner::before{top:6px}
.banner::after{bottom:6px;animation-delay:.17s}
@keyframes chase{50%{background-position-x:13px}}
.banner .btext{
  font-family:'Bebas Neue';font-size:min(17vw,84px);line-height:1;letter-spacing:.22em;text-indent:.22em;
  background:linear-gradient(178deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(245,208,97,.8));
  animation:btextPulse .5s ease-in-out infinite alternate;
}
@keyframes btextPulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.banner.go{animation:bannerIn 4.4s cubic-bezier(.2,1.3,.3,1) forwards}
@keyframes bannerIn{
  0%{transform:rotate(-3deg) scaleX(0);opacity:0}
  8%{transform:rotate(-3deg) scaleX(1.06);opacity:1}
  12%{transform:rotate(-3deg) scaleX(1)}
  88%{transform:rotate(-3deg) scaleX(1);opacity:1}
  100%{transform:rotate(-3deg) scaleX(1) translateY(-30px);opacity:0}
}

/* ── the mystery box ── */
.box{
  position:absolute;left:50%;top:50%;width:min(56vw,230px);aspect-ratio:1.18;
  transform:translate(-50%,-46%);display:none;cursor:pointer;z-index:6;
  -webkit-tap-highlight-color:transparent;
}
.stage.boxing .box,.stage.boxed .box,.stage.revealing .box{display:block}
.stage.boxed .coin-wrap,.stage.revealing .coin-wrap{opacity:0;pointer-events:none}
/* the prediction locks the moment the coin is sealed */
.stage.boxed .side-btn,.stage.boxing .side-btn{opacity:.4;pointer-events:none}
.bwrap{position:absolute;inset:0}
.bbody{
  position:absolute;inset:27% 5% 0 5%;border-radius:10px 10px 18px 18px;
  background:linear-gradient(180deg,#2b1c06,#160e04 55%,#0c0803);
  border:2px solid var(--gold-3);
  box-shadow:inset 0 8px 18px rgba(255,227,140,.14), inset 0 -14px 24px rgba(0,0,0,.65),
             0 18px 44px rgba(0,0,0,.6), 0 0 44px rgba(212,160,32,.22);
}
.bbody::before{ /* the wavefunction lives here */
  content:"ψ";position:absolute;left:50%;top:16%;transform:translateX(-50%);
  font-size:36px;line-height:1;color:var(--gold-3);
  text-shadow:0 0 18px rgba(167,139,255,.65), 0 1px 0 rgba(255,243,196,.25);
  animation:psiShift 3.2s ease-in-out infinite;
}
@keyframes psiShift{50%{color:var(--q);text-shadow:0 0 22px rgba(245,208,97,.7)}}
.qmath{
  position:absolute;left:50%;top:-15%;transform:translateX(-50%);white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:var(--text);
  opacity:0;transition:opacity .5s;text-shadow:0 0 14px rgba(167,139,255,.35);
}
.stage.boxed .qmath,.stage.revealing .qmath{opacity:1}
.qmath .aH{color:var(--gold-2)}
.qmath .bT{color:var(--q)}
.qmath.snap{animation:snapPulse .55s cubic-bezier(.2,1.4,.3,1)}
@keyframes snapPulse{30%{transform:translateX(-50%) scale(1.35)}}
.blid{
  position:absolute;left:0;right:0;top:9%;height:23%;border-radius:10px;
  background:linear-gradient(180deg,#3d2909,#1d1305);
  border:2px solid var(--gold-3);transform-origin:14% 100%;
  box-shadow:inset 0 3px 8px rgba(255,227,140,.28), 0 6px 14px rgba(0,0,0,.5);
  transition:transform .3s cubic-bezier(.3,1.2,.4,1);
}
.box.catpeek .blid{transform:rotate(-56deg) translate(-18%,-64%)}
.seam{
  position:absolute;left:7%;right:7%;top:31.5%;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold-2),var(--q),var(--gold-2));
  background-size:200% 100%;filter:blur(2px);opacity:.8;
  animation:seamFlow 2.4s linear infinite;
}
@keyframes seamFlow{to{background-position:200% 0}}
.blabel{
  position:absolute;left:0;right:0;top:58%;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;
  letter-spacing:.2em;color:var(--gold-1);text-shadow:0 0 14px rgba(245,208,97,.55);
}
/* superposition: the aura is two outcomes at once */
.stage.boxed .box{animation:superGlow 3.2s ease-in-out infinite}
@keyframes superGlow{
  0%,100%{filter:drop-shadow(0 0 22px rgba(245,208,97,.45))}
  50%{filter:drop-shadow(0 0 26px rgba(167,139,255,.55))}
}
/* observation: the superposition tears itself apart */
.box.collapsing{animation:collapseFlicker .14s linear infinite}
@keyframes collapseFlicker{
  0%,100%{filter:drop-shadow(0 0 30px rgba(245,208,97,.8))}
  50%{filter:drop-shadow(0 0 34px rgba(167,139,255,.9))}
}
.box.collapsing .bwrap{animation:collapseShiver .09s linear infinite}
@keyframes collapseShiver{50%{transform:translate(1.5px,-1px) rotate(.5deg)}}
.stage.boxed .bwrap{animation:rattle 4.2s ease-in-out infinite}
@keyframes rattle{
  0%,84%,94%,100%{transform:none}
  86%{transform:rotate(1.6deg) translateX(2px)}
  88%{transform:rotate(-1.8deg) translateX(-2px)}
  90%{transform:rotate(1.2deg)}
  92%{transform:rotate(-.8deg)}
}
.box.enter .bwrap{animation:boxIn .5s cubic-bezier(.2,1.25,.3,1)}
@keyframes boxIn{from{transform:translateY(70px) scale(.85);opacity:0}}
.box.slam .blid{animation:lidSlam .28s ease-out}
@keyframes lidSlam{0%{transform:translateY(-26px)}55%{transform:translateY(2px) scaleY(.82)}100%{transform:none}}
.box.open .blid{animation:lidOff .65s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes lidOff{to{transform:translateY(-120px) rotate(-28deg);opacity:0}}
.box.open .seam{opacity:0;animation:none}
.box.open::after{
  content:"";position:absolute;inset:-24%;pointer-events:none;
  background:radial-gradient(circle at 50% 34%, rgba(255,240,180,.85), transparent 62%);
  animation:burstFade .8s ease-out forwards;
}
@keyframes burstFade{from{opacity:0;transform:scale(.5)}30%{opacity:1}to{opacity:0;transform:scale(1.25)}}
.box.gone{animation:boxOut .5s ease-in forwards}
@keyframes boxOut{to{opacity:0;transform:translate(-50%,-46%) translateY(46px) scale(.9)}}
.box.deny .bwrap{animation:denyShake .4s}
@keyframes denyShake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ── Schrödinger's cat ── */
.cathole{position:absolute;left:6%;right:6%;top:-66%;height:78%;overflow:hidden;pointer-events:none}
.cat{
  position:absolute;left:50%;bottom:-8%;width:72%;aspect-ratio:.92;
  transform:translateX(-50%) translateY(116%);
  transition:transform .42s cubic-bezier(.3,1.35,.4,1);
  filter:drop-shadow(0 0 14px rgba(245,208,97,.35));
}
.box.catpeek .cat{transform:translateX(-50%) translateY(3%)}
.cat .ear{position:absolute;top:0;width:36%;height:30%;background:#0b0b10}
.cat .ear.l{left:1%;clip-path:polygon(8% 100%,100% 100%,52% 0)}
.cat .ear.r{right:1%;clip-path:polygon(0 100%,92% 100%,48% 0)}
.cat .head{
  position:absolute;inset:16% 0 0 0;background:#0b0b10;
  border-radius:46% 46% 40% 40%/58% 58% 34% 34%;
  box-shadow:0 0 0 2px rgba(245,208,97,.22);
}
.cat .eye{position:absolute;background:#fff;border-radius:50%}
.cat .eye.l{width:27%;aspect-ratio:1;left:13%;top:30%}
.cat .eye.r{width:36%;aspect-ratio:1;right:6%;top:24%}
.cat .eye i{
  position:absolute;width:36%;aspect-ratio:1;background:#000;border-radius:50%;
  left:32%;top:32%;transition:transform .28s;
}
.box.catpeek .eye.l i{transform:translate(10%,-42%)}
.box.catpeek .eye.r i{transform:translate(-46%,-30%)} /* googly — both tracking the coin */
.box.catch .eye.l i{transform:translate(30%,-58%)}
.box.catch .eye.r i{transform:translate(-20%,-58%)}
.cat .mouth{
  position:absolute;left:42%;top:68%;width:16%;height:9%;
  border-bottom:3px solid #efe9dd;border-radius:0 0 50% 50%;
  transform:rotate(7deg);opacity:.9;
}
.paw{
  position:absolute;left:77%;top:-80%;width:9%;height:54%;
  background:#0b0b10;border-radius:10px;transform-origin:50% 100%;
  transform:translateY(70%) scaleY(0);transition:transform .24s cubic-bezier(.3,1.3,.4,1);
  box-shadow:0 0 0 2px rgba(245,208,97,.18);
}
.box.catch .paw{transform:translateY(0) scaleY(1)}
.paw::after{ /* the catching paw, toe beans out */
  content:"";position:absolute;top:-11%;left:50%;transform:translateX(-50%);
  width:165%;aspect-ratio:1;background:#0b0b10;border-radius:50%;
  background-image:
    radial-gradient(circle at 27% 30%,#f2ead9 0 11%,transparent 13%),
    radial-gradient(circle at 52% 18%,#f2ead9 0 11%,transparent 13%),
    radial-gradient(circle at 76% 36%,#f2ead9 0 10%,transparent 12%);
  box-shadow:0 0 0 2px rgba(245,208,97,.22);
}
/* the shining gold spin after the catch */
.box.spinshine{animation:boxSpin 1s cubic-bezier(.25,.8,.3,1)}
@keyframes boxSpin{
  0%{transform:translate(-50%,-46%) perspective(700px) rotateY(0)}
  30%{filter:brightness(1.7) drop-shadow(0 0 36px rgba(245,208,97,.95))}
  70%{filter:brightness(1.35) drop-shadow(0 0 28px rgba(255,243,196,.8))}
  100%{transform:translate(-50%,-46%) perspective(700px) rotateY(720deg)}
}

/* ── two entangled coins, spinning in anti-phase, flanking the table ── */
.orb{
  position:fixed;z-index:2;border:none;padding:0;cursor:pointer;background:none;
  width:44px;height:44px;top:16vh;
  filter:drop-shadow(0 0 18px rgba(245,208,97,.8)) drop-shadow(0 0 9px rgba(167,139,255,.45));
  opacity:0;pointer-events:none;transition:opacity .45s;
  -webkit-tap-highlight-color:transparent;
}
.orb.show{
  opacity:1;pointer-events:auto;
  animation:orbIn .55s cubic-bezier(.2,1.3,.4,1), orbFloat 5.5s ease-in-out .55s infinite;
}
@keyframes orbIn{from{opacity:0;transform:scale(.4) translateY(12px)}}
.orb.o1{left:calc(50% - min(44vw, 225px))}
.orb.o2{left:calc(50% + min(44vw, 225px) - 44px)}
.orb.o2.show{animation-delay:0s, 2s}
.orb .mcoin{ /* a miniature Degen Coin */
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;border-radius:50%;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:17px;font-style:normal;
  color:#8a6210;text-shadow:0 1px 0 #ffefad;
  background:radial-gradient(circle at 35% 30%, #ffe9a0 0%, #f0c94e 42%, #d4a428 68%, #b8860b 100%);
  box-shadow:inset 0 0 0 2px #c9931a, inset 0 0 0 3px #f7dd7e,
             inset 0 -4px 7px rgba(90,60,8,.4), inset 0 3px 6px rgba(255,248,214,.45);
  animation:entSpin 2.6s linear infinite;
}
.orb.o2 .mcoin{animation-delay:-1.3s} /* its twin is edge-on exactly when this one faces you */
@keyframes entSpin{
  0%,50%,100%{transform:scaleX(1)}
  25%,75%{transform:scaleX(.1)}
}
.orb::before,.orb::after{ /* electron rings */
  content:"";position:absolute;inset:-26%;border-radius:50%;
  border:1px solid rgba(245,208,97,.45);
  transform:rotateX(66deg) rotate(12deg);
  animation:orbRing 8s linear infinite;
}
.orb::after{
  inset:-12%;border-color:rgba(167,139,255,.45);
  animation-duration:11s;animation-direction:reverse;
}

<script>
const $ = id => document.getElementById(id);
const stage=$('stage'), coin=$('coin'), hop=$('hop'), coinWrap=$('coinWrap');
const balanceEl=$('balance'), bank=$('bank');
const sheet=$('sheet'), scrim=$('scrim'), flash=$('flash'), ring=$('ring');
const verdict=$('verdict'), verdictWord=$('verdictWord'), verdictPay=$('verdictPay');
const shadow=$('coinShadow'), strobe=$('strobe'), tint=$('tint'), rays=$('rays'), muteBtn=$('mute');
const edgeglow=$('edgeglow'), toast=$('toast'), bannerText=$('bannerText');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let balance=0, wager=1, side='heads', rot=0, flipping=false;
let pendingCredit=0; /* win amount owed while the coin-flight animation plays */
let boxed=false; /* a flipped coin sits in the box in genuine superposition */
let dealPicking=false, dealYourFace=null, orbTimer=null;
const box=$('box'), boxLabel=$('boxLabel'), qmath=$('qmath'), coach=$('coach'), qtip=$('qtip');
/* the little i: tap to read how observation odds work, tap anywhere to dismiss */
$('qinfo').onclick=(e)=>{ e.stopPropagation(); qtip.classList.toggle('show'); };
addEventListener('pointerdown', e=>{ if(!e.target.closest('.qinfo')) qtip.classList.remove('show'); });

/* ── quantum observation tiers ──────────────────────────────────
   Nothing is decided at the flip. Paying to OBSERVE collapses the
   wavefunction — the more you pay, the more the amplitudes lean
   toward your side. Every tier keeps the same ~10% house edge:
   bigger payments buy certainty, not value.                      */
const OBSERVE = {
  1:  {p:.30, pay:3},   /* 30% → returns 3  (net +2)  */
  5:  {p:.45, pay:10},  /* 45% → returns 10 (net +5)  */
  10: {p:.60, pay:15},  /* 60% → returns 15 (net +5)  */
  20: {p:.75, pay:24}   /* 75% → returns 24 (net +4)  */
};

/* ── STRIPE SETUP (no backend needed) ────────────────────────────
   1. dashboard.stripe.com → Payment Links → "+ New" → create 4
      one-time products: "1 Degen Coin" $1 · "5 Degen Coins" $5 ·
      "10 Degen Coins" $10 · "20 Degen Coins" $20.
   2. On each link → "After payment" tab → "Don't show confirmation
      page" → "Redirect customers to your website" → the URL where
      this page is hosted, with the coin amount appended:
         https://degen.voyage/?coins=5      (match each product)
      Use the EXACT domain players visit (www vs no-www matters —
      localStorage doesn't cross origins, the balance would vanish).
   3. Paste the 4 buy.stripe.com URLs into PAY_LINKS below.
   4. Dry-run first: make the links in Stripe Test mode and pay
      with card 4242 4242 4242 4242 (any future date / any CVC),
      then swap in the Live-mode links.
   Flow: tap chip → balance saved → Stripe checkout opens in a
   POPUP so the table never unloads (same-tab fallback if the popup
   is blocked) → pay → Stripe redirects the popup to ?coins=N → the
   popup credits the coins to localStorage and closes itself → the

(function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  /* ambient floating gold dust */
  const t=performance.now()/1000;
  drawThread(t);
  for(const d of dust){
    d.y+=d.vy; d.x+=d.vx+Math.sin(t+d.ph)*.15;
    if(d.y<-4){d.y=innerHeight+4; d.x=Math.random()*innerWidth;}
    ctx.globalAlpha=d.a*(0.6+0.4*Math.sin(t*2+d.ph));
    ctx.fillStyle='#f5d061';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    /* homing coins: quadratic bezier from coin to bank, sparkling as they go */
    if(p.fly){
      p.t+=0.0166/p.dur;
      if(p.t>=1){ if(!p.done){ p.done=1; p.life=0; p.cb&&p.cb(); } continue; }
      if(p.t<=0) continue; /* staggered launch */
      const u=p.t*p.t*(3-2*p.t), v=1-u;
      p.x=v*v*p.x0 + 2*v*u*p.mx + u*u*p.x1;
      p.y=v*v*p.y0 + 2*v*u*p.my + u*u*p.y1;
      ctx.save(); ctx.translate(p.x,p.y);
      ctx.shadowColor='rgba(245,208,97,.9)'; ctx.shadowBlur=14;
      ctx.fillStyle='#f5d061';
      ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*(.35+.65*Math.abs(Math.sin(u*10+p.ph))),u*3,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#fff3c4';
      ctx.beginPath(); ctx.arc(-p.s*.3,-p.s*.3,p.s*.28,0,7); ctx.fill();
      ctx.restore();
      continue;
    }
    if(p.q){ /* orbiting quantum glyphs */
      p.a+=p.va; p.life-=0.006;
      p.x=p.cx+Math.cos(p.a)*p.rx; p.y=p.cy+Math.sin(p.a)*p.ry*.8;
      ctx.save();
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life,(p.max-p.life)*4))*.85;
      ctx.fillStyle=p.c; ctx.textAlign='center';
      ctx.font=`${p.s}px 'IBM Plex Mono', monospace`;
      ctx.fillText(p.glyph,p.x,p.y);
      ctx.restore();
      continue;
    }
    if(p.star){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.016; }
    else if(p.ribbon){ p.vy+=0.11; p.vy*=.985; p.vx*=.972; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.009; }
    else { p.vy+=0.28; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vx*=.985; p.life-=0.011; }
    ctx.save(); ctx.globalAlpha=Math.min(1,Math.max(0,p.life)); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c;
    if(p.star){
      ctx.globalAlpha=Math.min(1,Math.max(0,p.life))*(.4+.6*Math.abs(Math.sin(p.life*22+p.ph)));
      ctx.beginPath();
      for(let i=0;i<8;i++){ const rr=i%2?p.s*.32:p.s, a=i*Math.PI/4; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); }

      ctx.fillRect(-p.s*.45,-p.s*1.4,p.s*.9,p.s*2.8);
    }
    else if(p.coin){ ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*Math.abs(Math.sin(p.r*3)),0,0,7); ctx.fill(); }
    else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.4);
    ctx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ── music + sfx (synthesized, no files) ── */
let AC=null, master=null, musicBus=null, musicOn=true, schedTimer=null;
function audio(){
  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination);
    /* music gets its own bus so mute can cut already-scheduled notes instantly */
    musicBus=AC.createGain(); musicBus.gain.value=1; musicBus.connect(master); }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq, t0, dur, type='sine', vol=.2, dest=master){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+.05);
}
function noise(t0, dur, vol=.15, hp=6000, dest=master){
  const len=AC.sampleRate*dur, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t0);
}
/* looping lounge groove: swung bass + hats + sparkle arp, A minor */
const BPM=104, BEAT=60/BPM;
const bassLine=[110,110,164.8,110, 130.8,130.8,98,110];     /* A A E A · C C G A */
const arp=[440,523.3,659.3,880, 659.3,523.3, 587.3,493.9];
let bar=0;
function scheduleBar(t0){
  for(let b=0;b<8;b++){
    const t=t0+b*BEAT/2;
    /* kick on 1 & 3 */
    if(b%4===0){ const o=AC.createOscillator(),g=AC.createGain();
      o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+.12);
      g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+.25); }
    /* hats every 8th, accented offbeats */
    noise(t, .04, b%2? .07:.035, 8000, musicBus);
    /* bass */
    tone(bassLine[b], t, BEAT*.42, 'triangle', .22, musicBus);
    /* sparkle arp every other bar */
    if(bar%2===1) tone(arp[b]* (bar%4===3?1.5:1), t, .3, 'sine', .05, musicBus);
  }
  bar++;
}
function startMusic(){
  if(!musicOn || reduced) return;
  audio();
  musicBus.gain.cancelScheduledValues(AC.currentTime);
  musicBus.gain.setValueAtTime(1, AC.currentTime);
  const barLen=BEAT*4;
  let next=AC.currentTime+.05;
  scheduleBar(next);
  clearInterval(schedTimer);
  schedTimer=setInterval(()=>{
    while(next+barLen < AC.currentTime+barLen*1.5){ next+=barLen; scheduleBar(next); }
  }, 200);
}
function stopMusic(){
  clearInterval(schedTimer); schedTimer=null;
  /* kill notes already scheduled ahead, not just future bars */
  if(AC && musicBus){
    musicBus.gain.cancelScheduledValues(AC.currentTime);
    musicBus.gain.setValueAtTime(0, AC.currentTime);
  }
}
muteBtn.onclick=()=>{

function chime(){ if(!musicOn)return; audio(); const t=AC.currentTime;

function riser(dur){ if(!musicOn)return; audio();
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(80,t);
  o.frequency.exponentialRampToValueAtTime(1400,t+dur);
  g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.12,t+dur*.9);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2200;
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur);
  /* tick-tick-tick accelerating */
  for(let i=0;i<14;i++){ const tt=t+dur*(1-Math.pow(1-i/14,2)); noise(tt,.03,.1,5000); }
}

function mew(){ if(!musicOn)return; audio(); const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(850,t);

  if(win) setTimeout(()=>countPayout(net), 300);

  /* win: the net winnings fly into the bank and count up;
     loss: the observation fee drops out at the moment of impact */
  if(win){
    pendingCredit = net;
    const credit = ()=>{ if(!pendingCredit) return; const amt=pendingCredit; pendingCredit=0; setBalance(balance + amt); };
    if(reduced){ setTimeout(credit, 350); }
    else setTimeout(()=>flyToBank(Math.min(10, 4+Math.ceil(net/4)), ()=>{
      credit();
      const r=bank.getBoundingClientRect();
      spawnStars(8, r.left+r.width/2, r.top+r.height/2, 80);
    }), 500);
  } else {
    setTimeout(()=>setBalance(balance - stake), 350);
  }

  const hold = win ? 4400 : 2100; /* wins party longer */
  setTimeout(()=>{
    verdict.classList.add('out');
    setTimeout(()=>verdict.classList.remove('go','out'), 500);
    banner.classList.remove('go');
    flipping=false;
    stage.classList.remove('flipping','win'); stage.classList.add('idle');
  }, hold);
}
</script>
</body>
</html>
